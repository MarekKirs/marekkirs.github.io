title: "Kirs Lab"
tagline: "Advancing Water Quality and Public Health Across the Tropical Pacific Islands"
description: "Our laboratory at the Water Resources Research Center, University of Hawaiʻi at Mānoa, is dedicated to conducting research that responds to the water-quality and public health needs of Hawaiʻi and the Pacific Islands. 
Our work focuses on microbiological water quality across a range of water types, including recreational and drinking water, and addresses two fundamental questions: (1) is the water safe to drink or swim in? and (2) how can we improve its quality and its safe use?
These questions are particularly challenging, and critically important, in tropical island environments. In the tropics, beach season never ends. From a drinking water perspective, island communities often have no meaningful alternatives when their water resources (aquafiers, streams) become contaminated. Protecting these resources therefore requires a clear understanding of the microbial hazards present in the environment and their potential impacts on human health.
Through our microbiological research, we identify and characterize microbial contaminants and associated public health risks in Hawaiʻi and Pacific Island waters. We also develop and evaluate practical approaches to reduce these risks, improve water quality, and support the safe and sustainable use of water resources."


