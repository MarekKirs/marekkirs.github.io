# ------------------------------------------------------
# Lab website configuration
# Edit these values to customize your site.
# ------------------------------------------------------

title: "Kirs Lab"
tagline: "Studying water microbiology at the UNiversity of Hawaii at Manoa"
description: >-
  We are a research lab in the Department of [Department] at [University],
  working on [brief description of your lab's research focus].

# Used in the footer and contact page
university: "University Hawaii at Manoa"
department: "Water Resources Research Center"
address: "2540 Dole Street, Holmes Hall 283, Honolulu, Hawaii, 96822, USA"
email: "kirs@hawaii.edu"

# Social / external links (leave blank to hide)
twitter_url: ""
github_url: "https://github.com/kirslab"
scholar_url: ""
linkedin_url: ""

# Navigation bar — order matters
nav_pages:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: Team
    url: /team/
  - title: Publications
    url: /publications/
  - title: Data
    url: /data/
  - title: Join Us
    url: /join/
  - title: Contact
    url: /contact/

# ------------------------------------------------------
# GitHub Pages technical settings — usually no need to touch
# ------------------------------------------------------
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  people:
    output: false
  publications:
    output: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
